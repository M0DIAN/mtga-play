name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python state and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -B -X utf8 -m unittest discover -s tests -p 'test_*.py' -v

  javascript:
    name: JavaScript controller and session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/test_arena_ui.mjs tests/test_state_contract.mjs tests/test_match_session.mjs

  windows:
    name: Windows compatibility and no-input drag
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -B -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/test_arena_ui.mjs tests/test_state_contract.mjs tests/test_match_session.mjs
